name: Weekly Indonesia F&B and Oil&Gas Scraper

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python indonesia_agent.py

      - name: Commit and Push Updated Data & Excel Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add indonesia_companies.db Indonesia_FnB_OilGas_Directory.xlsx || true
          
          if git diff --staged --quiet; then
            echo "No data updates detected. Skipping commit."
          else
            git commit -m "auto: update company database and excel recap [skip ci]"
            git push
          fi
